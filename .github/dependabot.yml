# Dependabot configuration — version updates only.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems present in pleach:
#   - npm            (root package.json — zod, plus the biome/tsc/types dev set)
#   - github-actions (workflow action versions: checkout, setup-bun, the pages pair)
# The runtime is Bun, not npm. Dependabot reads package.json and bun.lock under the
# npm ecosystem; CI re-resolves with `bun install`, so a lockfile it cannot update
# still fails loudly in CI rather than landing quietly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
