# Pages-first public face (joint decision sheet #4): serve the repo DIRECTLY —
# the landing page and every garden polyglot are already self-contained
# webpages; the served page IS the repo file at the merged commit, so no
# derived artifact and no parallel truth exist. DORMANT until the repo is
# public and Pages is enabled (Settings → Pages → Source: GitHub Actions).
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
