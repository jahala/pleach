# A fault in the plan is refused before a worker costs anything

**Goal.** `pleach validate` refuses every command string the conductor would refuse at exec; a gate that cannot run at all fails the node once, naming the plan, never re-prompting a worker for it; the secret scan knows the documented example credentials; `pleach schema` agrees with the validator about what is optional; and the receipt's facts are the facts — the staged count is what the index holds, and a verdict says whether a worker ever spawned.

Ledger D19; jahala/pleach#64, #69, #75, #68, #73, #81 — the "Fail before spend" milestone. Each is a place where a fault the conductor could have named for free was found only after a worker had spent the owner's window: a smoke joined by `&&` that validate accepted and exec refused, fifteen minutes of a finished build later; a gate that could not exec at all, retried as if the worker had done something wrong; a test quoting an example key refused at close; a schema that told a planner a defaulted field was required; a staged count that counted what the editor touched; a verdict naming a model for a node that never spawned one.

## How

Validation reuses the guard exec has. `validatePlan` (src/core/validate.ts) splits every plan-authored command string — `work.command`, `work.test`, `setup`, `accept.smoke` — with the same `toArgv` + `shellOperatorTokens` the exec path uses (src/core/argv.ts) and refuses a bare operator as a `PlanInvalidError` with the escape hatch named; `pleach validate` exits 2, and `pleach run` refuses before the lock. A gate that cannot run — the guard's exit -1 or the exec seam's 127, before any command started — is a fault of the plan or the environment, never of the work: run-node settles the node on that attempt with `gate.ran` naming the command and a `detail` naming the fault, spending no further attempt and re-prompting nobody.

The secret battery (src/core/hygiene.ts) carries the documented example credentials the published rule sets name — AWS's documentation pair, GitHub's and Stripe's documented test tokens — vendored with provenance, so a test that quotes one is a test, and a live key is still a finding.

`pleach schema` (src/core/schema-json.ts) emits every field the zod schema defaults as optional, so a planner reading the schema and a plan passing the validator agree. `ReceiptFacts.stagedFiles` counts what the index holds after staging (the seam answers from `git diff --cached --name-only`), not the editor's touched set; and a `verdict` line carries `spawned: true | false` beside the cast it names, so a command node's `provider` reads as the cast that would have run and not as a claim that it did.

## Tried
- 2026-09-11 shaped from the "Fail before spend" milestone (jahala/pleach#64, #69, #75, #68, #73, #81), on cape-town's word that it follows "Land honestly". Design: validate reuses exec's tokenizer rather than a second grammar (one rule, one home); a gate that never ran is settled once with the fault named rather than classified retryable (a retry re-prompts the worker for something the worker cannot fix); the allowlist is exact-match and vendored with provenance rather than fetched (a scanner must not depend on the network to know a documented key); `spawned` is added rather than `provider` removed (the journal's stability promise says `provider` is never absent — the fix is to say what it means). Rejected: a schema change for any of it.
