# A fault in the plan is refused before a worker costs anything

**Goal.** `pleach validate` refuses every command string the conductor would refuse at exec. A gate that cannot run at all fails the node once, naming the plan, and never re-prompts a worker for it. The secret scan knows the documented example credentials. `pleach schema` agrees with the validator about what is optional. The receipt's facts are the facts: the staged count is what the index holds, and a verdict says whether a worker ever spawned.

Ledger D19; jahala/pleach#64, #69, #75, #68, #73, #81, the "Fail before spend" milestone. In each one the conductor could have named the fault for free, and instead a worker spent the owner's window first: a smoke joined by `&&` that validate accepted and exec refused fifteen minutes later, once the build had finished; a gate that could not exec at all, retried as if the worker had done something wrong; a test quoting an example key refused at close; a schema that told a planner a defaulted field was required; a staged count that counted what the editor touched; a verdict naming a model for a node that never spawned one.

## How

Validation reuses the guard exec has. `validatePlan` (src/core/validate.ts) splits every plan-authored command string (`work.command`, `work.test`, `setup`, `accept.smoke`) with the same `toArgv` and `shellOperatorTokens` the exec path uses (src/core/argv.ts), and refuses a bare operator as a `PlanInvalidError` with the escape hatch named. `pleach validate` exits 2, and `pleach run` refuses before the lock. A gate that cannot run is a fault of the plan or the environment, never of the work: the guard's exit -1, or the exec seam's 127 before any command started. run-node settles the node on that attempt with `gate.ran` naming the command and a `detail` naming the fault. No further attempt is spent, and nobody is re-prompted.

The secret battery (src/core/hygiene.ts) carries the documented example credentials the published rule sets name: AWS's documentation pair, and GitHub's and Stripe's documented test tokens. They are vendored with provenance, so a test that quotes one is a test, and a live key is still a finding.

`pleach schema` (src/core/schema-json.ts) emits every field the zod schema defaults as optional, so a planner reading the schema and a plan passing the validator agree. `ReceiptFacts.stagedFiles` counts the paths the index holds after staging, which the seam answers from `git diff --cached --name-only`, rather than the editor's touched set. A `verdict` line carries `spawned: true | false` beside the cast it names, so a command node's `provider` reads as the cast that would have run rather than a claim that it did.
