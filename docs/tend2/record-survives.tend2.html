# The record survives what the repository does

**Goal.** A refused commit is a gate verdict like any other. The tree is quarantined by a snapshot no hook can refuse, the receipt carries the hook's own output, and the node settles failed instead of vanishing. A lost run journal can still be recovered. A gap between the receipts and the journal is journaled on the next run, and every run leaves a copy of its own lines beside the receipts. A worker that wrote BLOCKED.md has finished and explained. The node settles blocked at once with the file's text, and there is no retry.

Ledger D21; jahala/pleach#96, #97, #93 (the "Nothing is lost" milestone, reopened). A planted repository's pre-commit hook refused every commit in a fresh worktree, and pleach kept nothing of a finished build. The stem's journal lost nineteen nodes between two runs, while the receipts beside it survived. A node that explained why it could not finish was run again to explain it again.

## Snapshot, witness, and a worker's own verdict

The quarantine is a snapshot. `IsolateSeam.snapshot(cwd, branch, message)` writes the index and working tree with `git write-tree`, `commit-tree` and `update-ref`, so no hook runs. `quarantineOrJournal` uses it, so evidence never depends on what the repository's hooks allow. The verified commit keeps going through `git commit`, because a hook is the repository's own gate and a hook that refuses a verified tree is a fact. When it refuses, nothing is discarded. The node settles failed with `gate.ran: 'commit'` and the hook's output as the tail, the tree is quarantined by snapshot, and the receipt is written and names the quarantine.

The journal has a witness. On `run-start`, every receipt whose node has no `verdict` line in the journal is journaled as `journal-gap` {node, receiptSha256, closedAt}. A vanished file shows up the next time anyone runs. At `run-end`, the run's own lines are copied to `<git-dir>/pleach/receipts/runs/<run-id>.journal.jsonl` and named on the `run-end` line, so the ledger can be rebuilt from what is kept beside the receipts.

BLOCKED.md is a verdict. When an attempt's tree holds `BLOCKED.md` at its root, run-node settles the node `blocked` at once. The file's text becomes `blockedReason`, the tree is quarantined, and there is no retry. The re-prompt of any retry says in one sentence that it starts from the prompt alone, because a note sent to the previous attempt did not survive it.

- 2026-09-12 shaped from the reopened "Nothing is lost" milestone (jahala/pleach#96, #97, #93), after the stem builder lost a finished build to a pre-commit hook and nineteen nodes' journal lines to a vanished file. Design: quarantine by snapshot (a hook may refuse a commit; it must never refuse the evidence), while the verified commit still runs the hooks (they are the repository's gate); a journal-gap check that reads the receipts as the witness (they are already per close and sealed); a per-run copy beside the receipts rather than a second journal (the ledger reads one shape, twice kept); BLOCKED.md as a verdict rather than a retry. Rejected: skipping hooks for the verified commit too (a repository's own gate is not pleach's to bypass); sealing the run copy under a run receipt (a run has no receipt — the copy is named by the run-end line, which is enough to find it).
