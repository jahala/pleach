# Isolate Seam: Git Worktree Lifecycle

**Goal.** Creates a detached git worktree per plan node at baseRefs[0], merges additional refs sequentially (keeping conflict markers in committed state for B3/C1), scans for conflict markers (C1), performs scoped staging (S1), commits to node/id branch (B2), resolves refs (B1), and disposes idempotently.

Worktree isolation is the mechanism that lets parallel nodes work on independent copies without interference, and that ensures auditor writes can't contaminate verified commits.

## A disposable worktree per node, never a shared branch

`src/seams/isolate.ts:isolate` opens `src/seams/isolate.ts:createIsolateSeam` by calling `git worktree add --detach` into a `mkdtemp` subdirectory under the OS temp dir. Because every worktree lives at its own path, two nodes can fan out from the same base ref in parallel without git's "already checked out" error — the fan-out test (developer:1) exercises exactly this. The worktree starts at `baseRefs[0]`; each remaining ref is merged in sequence. A clean merge (exit 0) moves straight to the next. An unresolvable conflict (exit 1) commits the marker-laden tree in-place with `git add -u && git commit` — not rolled back, not hidden — and populates `conflictFiles` so the [conductor loop](conductor-loop.loop.html) can surface those paths in the agent's re-prompt. Exit > 1 or an unrelated-histories error triggers `merge --abort`, then `dispose`, then `IsolateCatastrophicError`: the worktree never lands.

`isolate()` detaches a worktree and merges each dependency in turn, with three possible outcomes:

## Markers surface to the agent; the gate decides whether they land

`src/seams/isolate.ts:scanMarkers` runs `git grep -l --untracked -E '^(<{7}|={7}|>{7})'`. Exit 1 from git grep means no matches — clean. Exit 0 means matches — returns the file list. Exit > 1 means git itself failed; the function throws `IsolateCatastrophicError` rather than returning an empty array. A gate that cannot run must fail closed: reporting "clean" here would let conflict markers reach a verified branch (operator:0).

`src/seams/isolate.ts:stage` calls `git add -A -- <files>`, never bare `-A`. The file list comes from the union of `WorkerResult.filesTouched` and `src/seams/isolate.ts:changedFiles` (porcelain, gitignored paths excluded by default). Junk the agent dropped but didn't name cannot enter the commit. `src/seams/isolate.ts:commitBranch` then runs `git commit --allow-empty`, `git branch -f <branch> HEAD`, and `git rev-parse HEAD` — returning a 40-char SHA the loop records as `evidence.diffRef` before calling `emitVerdict` (operator:3). `src/seams/isolate.ts:refSha` resolves any ref to its SHA, returning null if absent — the loop's resume logic uses this to locate a prior verified node's branch without throwing on a first run.

`dispose` calls `git worktree remove --force` and treats "is not a working tree" and "not found" as success (idempotent for double-dispose). Any other non-zero exit throws `IsolateCatastrophicError`, so an unrecognized failure is never silently swallowed. After the worktree is removed, `dispose` deletes the `mkdtemp` parent directory (`tmpBase`) it owns via `fs.rm`. The [conductor loop](conductor-loop.loop.html) holds `dispose` until after `emitVerdict` returns, ensuring a waking dependent never sees its dependency's worktree vanish mid-resolve. See [../overview.html](garden.loop.html) for the project's broader bet.

## Where

src/seams/isolate.ts

## How

git worktree add --detach in os tmpdir; sequential git merge per baseRef[1..]; conflict exit=1 commits markers in-place; IsolateCatastrophicError on exit>1 or unrelated-histories; git grep -E for marker scan; git add -A -- <files> for scoped stage

## Fit

The git substrate the conductor loop isolates, gates, and commits against.

## Impact

Every node builds in a disposable worktree off its verified deps, so conflict markers and junk can never reach a verified branch.
