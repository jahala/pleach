# CI sees the runner, and a green canary means it checked

**Goal.** A change in umbel's runner contract turns CI red within a week, not whenever someone happens to run the suites by hand. A canary that could not run is red, never green.

Ledger D25, from the repository audit of 2026-09-23. The suites that drive the real umbel binary skip without it, and CI had neither umbel nor tmux. umbel moved to one tmux socket per session, so the D2 "dead" test's `tmux kill-session` on the default socket did nothing, and the test failed on every run without anyone seeing it. The weekly canary exited 0 with "SKIP" when no tend2 CLI resolved. GitHub's runners never had one, so all five scheduled runs were green having checked nothing.

## Two umbel jobs, one honest canary

The fake worker writes its pid, and the dead test kills that process while the worker is still asleep before its reply, so the kill always lands first and umbel sees a real death. CI's `runner` job installs tmux, builds umbel at the commit pinned in `UMBEL_REF`, and runs every suite that needs only umbel. The weekly `umbel-head` job runs the same suites against umbel's default branch, so a contract move shows before anyone bumps the pin. A test holds both jobs to the list of such suites, so a new one cannot skip in CI unnoticed.

The canary job builds tend2 from its repository. On CI a canary with no tend2 fails; locally it still skips. Until tend2's repository is public, that job is red, which is the truth.

## Tried
- 2026-09-23 shaped and built from the repository audit's findings F5, F6 and F9. First guess at the dead test, a zero-delay race, was refuted: with a 3 s delay it still failed; the cause was umbel's per-session tmux socket. Killing the worker before the send was tried and rejected, because umbel refuses a send to a dead session. The worker now sleeps 20 s before replying in this one test, so the kill wins every time: 7 of 7 umbel-seam tests passed three runs in a row, and 13 of 13 umbel suite tests passed against both the installed umbel and umbel master at 74cd093. The canary test was red on the old script and green on the new one. The umbel-seam check skips without umbel, so it was stamped with `PLEACH_UMBEL_BIN` set in the runner; CI's `runner` job is what keeps it honest from here. The CI jobs themselves are proven only by their first run on GitHub.
- 2026-09-23 the runner job's first run on master (after #140) failed the wedged-worker test with an empty `idle-work.txt` in the quarantine, though the PR's run had passed. The idle fixture rewrote its file on every line it read, and umbel's kill closes stdin, running that body once more while pleach snapshots the tree. The fixture now writes the file once, renamed into place (#141); master's runner job is green on b1f8fa7.
