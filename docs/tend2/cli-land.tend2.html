# pleach land: The Last Mile

**Goal.** `pleach land <plan>` (and `pleach run --land`) merges a verified plan's sink branches onto the branch checked out in --repo-root, so a verified close ends with working code on the user's branch — not stranded on node/<id> refs.

Ledger B3: the last mile was unspecified. Verified work sat on node/<id> branches; tend said verified while the working branch lacked the code. Every real adopter hit this wall first.

## How

Policy in src/loop/land.ts (all-or-nothing: refuses unless EVERY plan node is verified-closed; sinks resolve through the same B1/C5 baseRef chain as isolation), mechanics in IsolateSeam.land (src/seams/isolate.ts): merges build in a throwaway detached worktree and the user's checkout is only ever touched by a final `merge --ff-only` — a conflict, detached HEAD, moved branch, or overlapping uncommitted edit aborts with the repo byte-identical. Typed errors LandConflictError / LandBlockedError map to exit 1 at the face; every outcome journals.

## Impact

One command takes an operator from 'plan verified' to 'code on my branch'. No hand-merging node branches, no half-landed plans, no way to land unverified work.
