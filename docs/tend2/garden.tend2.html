# Project Garden

**Goal.** pleach — a deterministic conductor that interweaves a DAG of agent-built work into one verified canopy: it isolates each plan node in its own git worktree, enforces gates, and publishes a branch only for work that mechanically passed them.

Stochastic agents can't be trusted to self-certify, and reviewing every diff defeats the point of delegating to them. pleach makes deterministic code — never agent prose — the sole authority on what counts as done, so a swarm can build unattended without garbage reaching the trunk.

## Agents produce; code decides

pleach occupies the middle of the plot-plot suite. [tend](tend-seam.tend2.html) holds the feature ledger and decides what "done" means; [umbel](umbel-seam.tend2.html) holds each agent steady over tmux; pleach is the loop between them. Its single invariant: every canonical decision — close, verify, quarantine, retry, skip — is deterministic code. Agent output is parsed evidence, never a control-flow branch.

The design answers a verified defect ledger. Three classes of failure were found in the pre-pleach bridge: semantic deadlocks where honest work could never close (class A), state-lifetime splits where tend's `verified` status outran the git artifact it claimed (class B), and gate holes where conflict markers reached verified branches (class C). Each defect lands as a RED test before its fix (`docs/ledger.md`).

## The shape of a run

A run takes a `Plan` — a DAG of nodes — and drives it to a `RunSummary`. [The conductor loop](conductor-loop.tend2.html) is the engine: it schedules ready nodes, runs each through a fixed gate ladder, and publishes a `node/<id>` branch only for work that cleared every gate. The operator reaches it through [pleach run](cli-run.tend2.html), after [pleach validate](cli-validate.tend2.html) has rejected any malformed or cyclic plan before an agent is spawned.

Under the loop, each seam owns one concern: [isolate](isolate-seam.tend2.html) gives every node a disposable git worktree off its verified dependencies, [umbel](umbel-seam.tend2.html) drives the agent worker, [the tend seam](tend-seam.tend2.html) is the single serial writer to the ledger, [audit egress](audit-egress.tend2.html) recovers the cross-provider auditor's verdict intact, and [lock and journal](lock-journal.tend2.html) keep one conductor per repo with a replayable trace of every decision. Two invariants bind them: commit-before-emit — the branch exists in git before tend is told "verified" (ledger B2) — and quarantine — a node that fails its gates publishes nothing, and its dependents are skipped rather than built on a bad base.

## The contract

`docs/contract/plan-schema.md` is the canonical home of `@agent-contract/plan` v1.1.1 — the typed vocabulary tend, pleach, and umbel share. `src/core/plan.ts` matches its fenced block byte-for-byte under a drift test, so changing the schema means moving the doc, the source, the drift test, and `docs/contract/CHANGES.md` in one commit. The error taxonomy in `src/core/classify.ts` makes every retry decision a pure function of error type, not ad-hoc branching — the same discipline, one layer down.

## Where

This repo: faces/ (cli) -> loop/ (run-plan, run-node, run-work) -> seams/ (umbel, tend, isolate, exec, lock, journal) -> core/ (plan, validate, classify, errors). Strict downward dependencies; core pure, seams thin I/O.

## How

A pure, total core defines the contract and the classify ladder; thin seams own all I/O; the loop composes injected seams to isolate -> gate -> audit -> commit-before-emit each node, publishing node/<id> only for verified work. Every defect in docs/ledger.md maps to a RED test.

## Fit

The middle leg of the plot-plot suite — tend decides what the garden should bear, pleach interweaves the branches into one verified canopy, umbel holds each grower steady — and the canonical home of the @agent-contract/plan schema all three share.

## Impact

Agent work becomes trustworthy by construction: only verified nodes publish branches, failures quarantine their own subtree, and the operator reads one RunSummary instead of auditing N diffs. Agents produce; code decides.
