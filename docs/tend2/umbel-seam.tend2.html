# umbel Runner Adapter: Agent Worker Bridge

**Goal.** Spawns umbel-managed agent workers (claude, codex) over ExecFn arg-arrays and drives them with send/wait/kill. Threads sinceMtime for race-free stop detection, gathers finalMessage+actions+diff after stop, and passes provider-specific flags (allowedTools for claude, permissionMode for claude+codex).

The umbel seam is the only path to spawning and communicating with agent workers. Correct sinceMtime threading and reason classification are what let the loop tell stop, timeout, dead and blocked apart.

## One typed exit for every way an agent can stop

`umbelRunner(opts)` in `src/adapters/umbel.ts` is the bundled runner adapter's public factory, built over an exec-injectable `createUmbelSeam(exec, opts)` core. It returns a value satisfying the `RunnerSeam` port (`loop/deps.ts`): a single `spawnWorker` call yielding a `Worker` of three methods and a name. Every interaction with a stochastic agent flows through this port. Nothing else in the codebase touches umbel directly, and a `pleach.config.ts` can swap umbel for any other runner. The [conductor loop](conductor-loop.tend2.html) receives the runner at startup and calls `spawnWorker` per node. The [audit egress](audit-egress.tend2.html) runs its cross-provider auditor through the same runner.

`spawnWorker` assembles an `umbel spawn` argv: `--name pl-<hex> --cwd` plus `--provider`, `--model`, `--allowed-tools` (claude only), `--permission-mode` (claude + codex), and any `--env K=V` pairs for test injection. It throws `WorkerSpawnError` on a non-zero exit or a missing name echo. From there the adapter holds exactly one piece of state, a `sinceMtime` number captured from `send --json` output and threaded into the next `wait --json --since <mtime>`. That is the race-free stop detection the spec names. `sinceMtime` pins the pre-send filesystem snapshot, so a stop file written before the send cannot satisfy the wait. After `wait` returns `stop` the adapter advances `sinceMtime` to `Date.now()`, so a second wait without a new send gets `timeout` rather than a stale match on the same file.

## Dead tmux session and hung workers never hold a slot

The six `wait` reasons (`stop`, `dead`, `timeout`, `aborted`, `input`, `idle`) split cleanly in `gatherWorkerResult`. Only `stop` triggers the three subsidiary calls: `umbel read` for the untruncated `finalMessage` (ledger C4: audit egress parses this text), `umbel actions --json` for `filesEdited ∪ filesWritten` (deduplicated into `filesTouched`), and `umbel diff`. Every other reason returns an empty `finalMessage` and empty `filesTouched`. `input` and `idle` carry the umbel `message` field, so the loop can surface the blocking prompt text in the verdict before skipping dependents. A `dead` result, the tmux session killed out-of-band, surfaces immediately. A `timeout` fires when umbel's own deadline expires and umbel kills the process before returning. Neither path leaves the adapter waiting. `kill` tolerates already-dead workers (non-zero exit is ignored), so the loop can always call it on teardown without a guard.

## The adapter is one file

src/adapters/umbel.ts

## The umbel commands behind each call

umbel spawn --name --cwd [--provider] [--model] [--allowed-tools] [--permission-mode] [--env K=V]; send --json captures sinceMtime; wait --json --since --timeout; read/actions/diff gathered on stop; WorkerSpawnError/WorkerSeamError on failures

## Provider churn stays behind the runner port

The execution boundary between [the conductor loop](conductor-loop.tend2.html) and the agent providers, keeping umbel and provider churn behind the runner port described in [pluggable-adapters](pluggable-adapters.tend2.html).

## Stochastic agents behind one typed boundary

Stochastic agents are driven through one spawn/send/wait/kill boundary, with dead, timeout and blocked surfaced as typed reasons. What [the conductor loop](conductor-loop.tend2.html) does with each of them is its decision, not this seam's.
