# pleach validate: Structural Plan Validation

**Goal.** Parse a plan.json, enforce structural invariants (duplicate IDs, unknown needs references, provider diversity rule), and detect cycles via Kahn's toposort. On success it prints {valid:true, order:[...]} to stdout. The output also carries execution waves (parallel batches) and a per-node summary (work-type + gates), so an author can see what a plan will do before running it.

Catch a malformed or cyclic plan before a single agent is spawned, so an unattended run never starts on a plan that can't close.

## Structural bugs are cheaper to catch here than anywhere else

An operator drops a six-node plan into `pleach run` and walks away. Say that plan contains a cycle, where node `b` needs `a` and `a` needs `b`. The conductor's Kahn scheduler drains the queue, never promotes either node, and sits idle until a process limit or wall-clock timeout kills it. The operator returns to a deadlocked run, no verdicts, subscription burned. `pleach validate plan.json` catches this in milliseconds.

`validatePlan` in `src/core/validate.ts` is a pure, total function over the `Plan` type defined in `src/core/plan.ts`. It accumulates failures into a `reasons[]` array rather than short-circuiting, so a single call surfaces every structural defect at once. It runs four checks in order: duplicate node IDs, unknown `needs` references (a node declaring a dependency on an ID that doesn't exist in the plan), the provider-diversity rule, and finally Kahn's toposort for cycle detection. The diversity check resolves `worker.provider` against `DEFAULT_WORKER_PROVIDER` (`'claude'`) when the field is omitted. A plan that leaves `worker.provider` unset but sets `accept.audit.provider = 'claude'` is therefore rejected on the same grounds as one that spells it out. The [conductor loop](conductor-loop.tend2.html)'s cross-provider audit gate only has teeth if the auditor is a different model than the builder, and `validatePlan` enforces that at plan-acceptance time. Structural errors (duplicates, ghost refs, diversity violations) are thrown before toposort runs, because Kahn requires a clean graph. A cycle in the survivors raises `PlanInvalidError(['dependency cycle detected in plan nodes'])`. On a clean plan the function returns `{ order: string[] }`, the topological order the conductor will schedule, and the CLI prints `{valid:true, order:[...]}` to stdout and exits 0.

The function is the shared core of the `validate` CLI face and [pleach run](cli-run.tend2.html). The bet is in [../overview.html](garden.tend2.html).

## Where

src/faces/cli.ts; src/core/validate.ts; src/core/plan.ts

## How

readPlan (Zod parse) → validatePlan (structural checks + Kahn toposort) → print JSON → exit 0; any error → stderr + exit 2; validatePlan also returns waves (level-order Kahn on a copy of the in-degree map, so order is unchanged); nodeSummaries projects each node's work-type + declared gates; verbValidate emits {valid, order, waves, nodes}

## Fit

The pre-flight check for `pleach run`; shares the schema + validatePlan core.

## Impact

Invalid plans fail in milliseconds with a precise reason instead of deadlocking or corrupting a run.
