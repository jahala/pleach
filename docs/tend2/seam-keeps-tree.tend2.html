# A seam's surprise never costs the tree

**Goal.** Whatever a runner says or fails to say, the tree a node built is kept. The umbel adapter reads the wait's reason from the JSON whatever the exit code, so timeout, idle, dead, input and provider-error all reach the classifier that already knows most of them. Every reason in the runner contract is named and classified as the contract says, with provider-error retryable within the node's attempts. A surprise anywhere in a node's run settles the node like any other end: the attempt is counted, the tree is quarantined, and a receipt is written with the seam's own text as the reason and the next step to take. So `pleach audit` or a re-run starts from what was built.

Ledger D23; jahala/pleach#120 and #110. On 2026-09-18 jahala/quadrat lost four verified trees overnight. umbel's `wait` now exits non-zero for every reason but stop (122 provider-error, 123 idle, 124 timeout, 125 dead, 126 input, 130 aborted; `contracts/runner.md` on jahala/plotplot), and it still prints `{"reason": …}`. The adapter threw `WorkerSeamError("wait exited N")` on the exit code before parsing the reason. run-node's safety net then disposed the live tree on the throw. run-plan's catch journaled `failed` and returned before `settle()`, the only writer of the receipt and the quarantine. A machine's sleep, an attempt clock and a stalled auditor each ended as `failed after 0 attempt(s)`, with nothing kept but the worker's transcript.

## How

The reason is the result. In the adapter's wait, stdout that parses and carries a `reason` is the answer whatever the exit code. `WorkerSeamError` is thrown only when no reason parses, and it then carries the exit code and the output. The run's own abort keeps its early answer (D16).

A surprise settles. run-node catches what its attempt loop did not name and hands the live tree back with a failed verdict: `gate.ran` names the seam, the error's text is the tail, and the attempt is counted. The verdict's detail states the next step. That is `pleach audit <plan> <node>` when the audit lane threw over a green tree, and otherwise a re-run, which resumes from the quarantine (D17). run-plan's own catch settles too instead of returning, so a throw from anywhere leaves a receipt. The path follows the refused-commit precedent (D21): keep, then dispose.

The contract is the table. `WorkerResult.reason` and `classifyWorkerReason` name all nine reasons of `contracts/runner.md`, in the shapes the umbrella's seam test reads. Stop, file, pattern and aborted are terminal; provider-error and timeout are retryable; idle and input are blocked; dead is dead. A reason nobody named still falls to terminal and is journaled as `seam-violation` with its text. A vendored copy of the contract's fixture pins the table in this repository's own suite.
