# A seam's surprise never costs the tree

**Goal.** Whatever a runner says or fails to say, the tree a node built is kept. The umbel adapter reads the wait's reason from the JSON whatever the exit code, so timeout, idle, dead, input and provider-error reach the classifier that already knows most of them; every reason in the runner contract is named and classified as the contract says, provider-error retryable within the node's attempts. A surprise anywhere in a node's run settles the node like any other end: the attempt counted, the tree quarantined, a receipt written with the seam's own text as the reason and the next step to take, so `pleach audit` or a re-run starts from what was built.

Ledger D23; jahala/pleach#120 and #110. On 2026-09-18 jahala/quadrat lost four verified trees overnight. umbel's `wait` now exits non-zero for every reason but stop (122 provider-error, 123 idle, 124 timeout, 125 dead, 126 input, 130 aborted; `contracts/runner.md` on jahala/plotplot) and still prints `{"reason": …}`. The adapter threw `WorkerSeamError("wait exited N")` on the exit code before parsing the reason; run-node's safety net disposed the live tree on the throw; run-plan's catch journaled `failed` and returned before `settle()`, the only writer of the receipt and the quarantine. A machine's sleep, an attempt clock and a stalled auditor each ended as `failed after 0 attempt(s)` with nothing kept but the worker's transcript.

## How

The reason is the result. In the adapter's wait, stdout that parses and carries a `reason` is the answer whatever the exit code; `WorkerSeamError` is thrown only when there is no parsable reason, and then carries the exit code and the output. The run's own abort keeps its early answer (D16).

A surprise settles. run-node catches what its attempt loop did not name and hands the live tree back with a failed verdict: `gate.ran` names the seam, the error's text is the tail, the attempt is counted, and the verdict's detail states the next step — `pleach audit <plan> <node>` when the audit lane threw over a green tree, a re-run otherwise, which resumes from the quarantine (D17). run-plan's own catch settles too instead of returning, so a throw from anywhere leaves a receipt. The path follows the refused-commit precedent (D21): keep, then dispose.

The contract is the table. `WorkerResult.reason` and `classifyWorkerReason` name all nine reasons of `contracts/runner.md` — stop, file and pattern terminal; provider-error and timeout retryable; idle and input blocked; dead dead; aborted terminal — in the shapes the umbrella's seam test reads. A reason nobody named still falls to terminal and is journaled as `seam-violation` with its text. A vendored copy of the contract's fixture pins the table in this repository's own suite.
