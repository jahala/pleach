# Landing reads the map and does not wait on the whole run

**Goal.** A landing holds its own lock, so a settled node lands while the run is still gating others and the refusal names who holds what; `pleach land --sinks` lands a verified subset; and a land gate the operator names (`--land-gate CMD`, with `{base}` substituted) runs on the composed stack before publish, so a landing that would leave the garden's stamps stale is refused with the reason printed, never landed green.

Ledger D18; jahala/pleach#83, #84. On weeder a settled node's landing answered "lock held" until the whole run ended, and a rename that moved eleven loops' evidence landed green: fifty-one stamps sat stale on master for three days, two of them hiding real drift. `tend2 gate --base` already answers that question; pleach never asked it.

## How

The run's lock guards the run's state; a landing writes the base branch, which the run never touches. So `landPlan` (src/loop/land.ts) takes a lock of its own through the lock seam (`<lock>.land`, the same (repoRoot, source) naming), and only another landing can refuse it; the refusal (`LockHeldError`) names the holder's pid and which lock it holds. `--sinks <id,…>` narrows the landing to named verified sinks — a named node that is not verified is refused by name before anything is built — and `land-start` journals the subset; without the flag the all-or-nothing rule stands.

The map gate is a command, not a dependency. `--land-gate CMD` (repeatable) is parsed argv-style with no shell like every plan-authored command, `{base}` replaced by the target branch's tip sha before the merge, and run in the provisioned stack after the sinks' own smokes. A non-zero exit refuses the landing: `land-gate-refused` {command, exitCode, outputTail} on the journal and the tail on stderr, the stack disposed, the checkout untouched. The garden's runbook passes `tend2 gate docs/tend2 --base {base} --runner 'bun test {evidence}'`; pleach knows nothing about stamps.
