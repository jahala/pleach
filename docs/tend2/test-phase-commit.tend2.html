# The red phase is its own commit

**Goal.** When a node's work carries a test phase (`{test, phases}`), pleach seals the red phase as its own commit the moment the RED gate passes — before the impl prompt is sent — so the failing-test state exists in `node/<id>` history: base → red → verified. The GREEN gate runs against the combined tree; the verified commit stacks on the red one.

Ledger D13. pleach 0.0.1 gated RED-must-fail and GREEN-must-pass in the worktree and then committed the whole tree once at settle. Nothing in history proved a failing test ever existed; `weeder bite` (rule B1, "a test passed without the change it covers") had no commit to check out, and copeca's corpus minting and the slice-coverage rule stand on the same missing commit. The umbrella's law (docs/building-the-garden.md §5) mandates the separate test-phase commit.

## How

`runWork` (src/loop/run-work.ts) drives the phases; it is given a seal function by `runNode` (src/loop/run-node.ts) and calls it once, after the RED gate passes and before the impl phase's prompt is sent. The seal does what the close does, in miniature: scoped staging of the red phase's files (`filesTouched` ∪ `changedFiles`), the marker scan, the hygiene battery over the staged diff, then a commit on the detached HEAD (no branch moves — `node/<id>` is only ever published at settle). Subject `pleach: <id> red phase`, trailer `pleach-phase: red`. The journal records `phase-commit` with the sha and the sealed files. A red phase that changed no file fails the `red` gate with evidence instead of sealing nothing.

Retries keep the seal honest. Once a red commit exists on the attempt's tree, a retry resumes at the impl phase carrying the evidence — the seal is never remade, because a second "red" taken from a tree that already holds impl work would be a lie. A red-gate failure before any seal restarts at red as before. Dead-and-resume re-isolates a fresh tree and the seal state resets with it.

`pleach validate` warns on a node whose phases end on `impl`: no green gate ever runs, so the combined tree is never proven. The warning rides the JSON (`warnings[]`) and stderr; the plan stays valid.

## Impact

`weeder bite` is a checkout and a run. Every phased node's history shows the failing test before the change that made it pass, and a worker that weakens a test during impl leaves that edit in the impl commit where `weeder check` judges it against the sealed red.

- 2026-09-08 shaped from cape-town's order (umbrella fit loop, weed's bite kill report 2026-09-06). Design: seal at RED-pass inside the phase loop (not a settle-time split — a split from a tree that may hold impl edits cannot prove what actually ran red); the seal is a commit on the detached HEAD, gated by the same marker + hygiene scans as the close; retries resume at impl once sealed. Rejected: recording the red sha inside the receipt envelope (git already binds parent → child; the trailer names the phase) and re-running the smoke on the red diff (the smoke judges delivered work; hygiene covers secrets in tests).
