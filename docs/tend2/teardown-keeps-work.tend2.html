# A halted run keeps the work it was holding

**Goal.** Stopping a run never loses a node's work. A node whose wait the run's own signal interrupts settles with `Verdict.status: 'aborted'`, a receipt, and its tree quarantined as it stands. `pleach stop <plan>` drains: the scheduler reads the stop marker in the same tick as every launch decision, launches nothing more, lets in-flight nodes settle normally and journals `run-stopped`; `--now` is the hard abort. A wedged worker ends at an idle timeout the conductor passes to the runner instead of riding to the attempt clock.

Ledger D16; jahala/pleach#61, #67, #72. In two days a halted run cost work three times: a SIGINT during an audit disposed a finished, staged build with no receipt and no quarantine; an operator's drain raced the scheduler and spawned a worker only to kill it; a codex auditor idle on a 404 would have ridden to a thirty-minute timeout with the operator as the idle detector.

## How

The real umbel adapter (src/adapters/umbel.ts) throws `WorkerSeamError` when the run's signal kills `umbel wait`, while the in-memory runner returns `aborted` — D12's loop test is green over a path the real seam does not take. The adapter now answers `reason: 'aborted'` when its own signal fired. run-node (src/loop/run-node.ts) treats an aborted wait like every other terminal reason: it hands the live tree back with `status: 'aborted'` and `gate.ran: 'wait:aborted'` rather than throwing into the `finally` that disposes. settle (src/loop/run-plan.ts) takes the non-done path it already has — receipt minted and written, tree quarantined as it stands through `quarantineOrJournal` — and `RunSummary.aborted` names the node; `summaryExitCode` counts it as not clean.

The drain is a marker, not a signal. `pleach stop <plan.json>` (src/faces/cli.ts) writes a stop marker beside the run's lock for the same (repoRoot, source) — through the lock seam (src/seams/lock.ts), which is where that path is known — and refuses when no live run holds the lock. The scheduler consults the marker through the seam in the same tick as every launch decision, so a marker written between two closes yields zero further `node-start`; in-flight nodes settle normally; the run journals `run-stopped`, consumes the marker, and ends as today with the unstarted nodes in `skipped`. `--now` additionally sends SIGINT to the pid the lock names, which is the aborted path above.

The idle timeout is a conductor default (`--idle-ms`, ten minutes) threaded to `Worker.wait` as `idleMs`; the umbel adapter passes it as `--idle-timeout`, and umbel's `idle` return (exit 0, `{"reason":"idle"}`) classifies as it does today: blocked, prompt text as `blockedReason`, tree quarantined.

## Impact

An operator can drain a run at a node boundary without racing the scheduler, abort it hard without losing a finished build, and leave a wedged worker to the conductor. A quarantined tree and an `aborted` receipt are what `pleach clean` and a resume find afterwards, instead of a bare seam error.

## Tried
- 2026-09-11 shaped on cape-town's word while tend2 runs its six, from #61, #67 and #72 — the defects that lost the most window this week. Design: the adapter answers `aborted` (the seam knows its own signal fired; the loop must not have to guess from an exit code); the drain is a marker read in the launch tick (a signal cannot be made race-free against a scheduler that launches in the same tick as a close); the idle timeout is a conductor default, not a plan field (no contract change — `policy` stays as it is). Scoped OUT, deliberately: #61's second half, resuming FROM a quarantined tree (`pleach run` reusing `quarantine/<id>` as the retry's base) — a resume today re-isolates and rebuilds, which is correct and loses only time; reusing a quarantine as a base needs the acceptance-evolution rules to say what a quarantined base proves, and that is its own loop.
