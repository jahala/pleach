# A hook may refuse the verified commit but never change it

**Goal.** What publishes on `node/<id>` is exactly the tree the gates judged. The repository's hooks still run on the verified commit and may still refuse it (D21). A hook that changes what the commit holds fails the node the same way a refusal does: the branch never moves, the tree is quarantined, and the receipt is written.

Ledger D24, from the repository audit of 2026-09-23. A pre-commit hook can change the index while `git commit` runs. A formatter rewrites a file, or a hook stages one of its own. Every worktree shares the repository's hooks directory, and a worker reaches it through its tree's `.git` pointer, so a hook written by one node runs in every later node's commit. `commitBranch` committed whatever the hook left and moved the branch to it. The audit reproduced this in a scratch repository: a hook planted from one worktree added a file to a commit made in another.

## Compare the trees, then move the branch

Every commit pleach makes through `git commit`, the verified commit and the red-phase seal (D13) alike, writes the staged tree first. After the commit it compares that tree with the committed one. If they differ, HEAD goes back to its parent, the branch is never moved, and `CommitAlteredError` names the changed paths. The loop already settles any throw from the verified commit as a refusal under the `commit` gate, so no loop code changes. The quarantine holds what the index held, the hook's change included, standing on the node's base.

A check against hook tampering in general was considered and rejected. pleach does not sandbox the worker, and a worker that can write hooks can write anything its user can. The tree comparison is the check that protects what pleach promises: nothing a gate did not judge is published.
