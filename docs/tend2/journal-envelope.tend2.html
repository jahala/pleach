# The run journal carries the friction profile's envelope

**Goal.** Every line the run journal writes carries the garden's one event envelope in addition to its own fields: `time` (UTC, ends in `Z`), `event.name` (`pleach.<event>`), `plotplot.kind` (a pinned kind), `plotplot.count` (1), `plotplot.harness` and `gen_ai.conversation.id` (present, `null` — pleach observes the runner, not a harness turn); `verdict` lines add `plotplot.runner` (the runner's CLI name, verbatim) and `gen_ai.request.model` where the plan named a model. `gen_ai.provider.name` is never written by pleach: the runner is the fact pleach holds, the provider behind it is not. Existing event names and documented fields are unchanged.

Ledger D15; jahala/pleach#60; the envelope is contracts/friction-profile.md at jahala/plotplot v1.1.0 and contracts/fixtures/friction.jsonl line 2 is a pleach journal line authored in it. The garden writes three append-only JSONL streams with three envelopes for one purpose; tend2's ledger face (jahala/tend#154) reads all three, and one envelope means one loader.

## How

A pure `envelope(event, now)` in core (src/core/journal-envelope.ts) takes the event object the loop appends today and returns the line to write: every input field verbatim, then the envelope keys. `plotplot.kind` comes from one exhaustive table keyed by event name — `gate.retry` for `gate-retry` (pinned), and the three kinds the umbrella pins for pleach: `run.lifecycle` (run and land lifecycle events), `node.lifecycle` (every node-scoped event), `gate.result` (gate outcomes). Node-scoped lines mirror `node` as `plotplot.node`; gate lines mirror `gate` as `plotplot.gate` (present and `null` on land-level gate lines). `verdict` lines carry `plotplot.runner` — the resolved runner name the line's `provider` field already holds, verbatim — and `gen_ai.request.model` only when the plan set `worker.model` (the profile's "never told us" rule: the key is omitted, not nulled); `gen_ai.provider.name` is omitted on every line, because Claude Code can be routed through Bedrock or Vertex and pleach cannot see which — when umbel learns to read the provider from the CLI's own configuration it fills that key and nothing in pleach changes. An event name with no kind is a typed throw — unreachable while the documentation pin holds, never a silent default.

The journal seam (src/seams/journal.ts) is the one place lines are emitted; it wraps every append with `envelope` and a real clock. In-process narrators (`buildDeps({ narrate })`) receive the same enveloped line. Loop tests keep asserting on raw events through the in-memory journal; the envelope is proven on the real seam and end to end.

## Impact

Every journal line parses as one JSON object carrying the envelope, so tend2 reads pleach's journal the way it reads the friction journal; the `verdict` line's `plotplot.runner` is the runner name the casting join uses.
