# Scripted runner — deterministic, no-LLM execution

**Goal.** A deterministic RunnerSeam (src/adapters/scripted.ts) that applies canned worktree changes per build prompt and returns a canned cross-provider AuditResult — no LLM, no API keys, no network. Paired with two runnable examples (command-dag, scripted-agent) and a CI e2e, it lets a whole plan — work, smoke, cross-provider audit — run end to end with nothing but git + bun.

Before this, the only real-process way to run a plan was umbel (interactive, subscription, tmux), so a prospect or contributor could not try pleach and CI could not exercise the loop end to end. The scripted runner makes the conductor runnable and demonstrable by anyone, and proves the RunnerSeam port is genuinely open — a third-party runner produces the same RunSummary the engine gates on.

## Where

src/adapters/scripted.ts; examples/command-dag/; examples/scripted-agent/; test/e2e/examples.test.ts; test/unit/scripted-runner.test.ts

## How

scriptedRunner(scenarios): RunnerSeam — spawnWorker captures cwd; the worker's wait() writes the matched scenario's files into cwd and returns { reason: 'stop', finalMessage, filesTouched }. Scenarios match first-wins: by spawn provider (selects the cross-provider auditor) and by a prompt substring (selects per-node build output). scriptedAuditResult(verdicts) builds the tend-audit-result fence the egress parses. It is a real seam (it writes real files the loop gates on), not a behaviour mock. Exported at pleach/adapters/scripted.

## Fit

A bundled reference adapter alongside umbel/tend/git — the deterministic counterpart to umbel for CI, demos, and tests; the proof that "agents produce; code decides" runs without a live agent.

## Impact

Onboarding drops from "install umbel + get API keys" to "bun test". It doubles as a regression target for the gate ladder (isolation, smoke, cross-provider audit, quarantine) and a copy-paste template for writing any RunnerSeam.
