# A secret in a worker's output never reaches disk

**Goal.** Everything pleach writes from an agent or a gate, journal lines, the handback, gate artifacts, passes through one shared redactor first, so a token a worker read from a `.env` file or a gate printed is `[REDACTED]` on disk. A run that cannot redact does not start, unless the operator opts out by name and the opt-out is on the record.

Ledger D37, jahala/pleach#107. The plotplot stem ships the one implementation for the whole garden, `plotplot redact` (plotplot#52): stdin in, stdout out, fails closed.

## One seam, one call per line

A redact seam runs `plotplot redact` with the text on stdin. The journal seam is the one home for journal redaction: every string of every event goes through it before the envelope is applied, in one call per event, the strings joined by a boundary line and split back; a result that does not split back fails closed. The handback and friction artifacts are redacted where they are kept, and the smoke gate's findings log before its hash is sealed, so each kept file and its hash agree.

`run`, `land` and `audit` prove the redactor works before they take the lock, and refuse with exit 2, naming the install command, when it does not. `--no-redact` turns redaction off, and the run records `redaction: 'off'` on `run-start` and in every receipt.
