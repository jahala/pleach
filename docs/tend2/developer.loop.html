# Developer

**Who.** An engineer extending pleach's own machinery — a seam, the scheduler, the contract — who must preserve hard invariants (pure core, I/O only at the seams, the defect-ledger guarantees) while the codebase is still greenfield. Works test-first by mandate: a change isn't legitimate until a ledger-tagged RED test demanded it and `bun run check` is green.

Opens the repo to add a provider to the umbel seam or tighten a gate. Finds the ledger item, writes the failing test first, then leans on the faces->loop->seams->core boundaries so they never have to wonder whether a function is allowed to touch git. Scenario: a schema field needs to change — they edit the doc, the source, the drift test, and CHANGES.md in one commit, because tend and umbel vendor the contract byte-for-byte.

## Jobs
- When I add a capability, because I must not let I/O leak into pure logic or a scheduling decision leak into a seam, we believe the layer boundaries make the wrong place to put code obviously wrong. We'll know we got it right when a change lands in exactly one of faces / loop / seams / core without debate, and the import graph stays strictly downward — core imports nothing, the loop receives seams it never imports.
- When I fix a defect or change behavior, because a fix without a demonstrating test is a guess, we believe every change begins as a failing, ledger-tagged test. We'll know we got it right when the behavior maps to a `// ledger: <id>` test that was RED before the change and GREEN after, and `bun run check` (typecheck + lint + the full suite) is green before merge.
- When I change the plan schema, because tend and umbel vendor it byte-for-byte and a silent divergence breaks all three repos, we believe schema, source, and doc move together or not at all. We'll know we got it right when the drift test pins `plan.ts` to `plan-schema.md` byte-for-byte and the change lands as doc + source + drift-test + a CHANGES.md entry in one commit.
- When convenience argues for a TODO, a mock in shipped code, or a compat shim, because greenfield always tempts the shortcut, we believe committed code is real and complete. We'll know we got it right when review finds no committed `// TODO`, no behavior-mock outside the in-memory seam doubles, and every dormant config field is annotated `[ROADMAP]`-inert rather than half-wired.
- When a run misbehaves, because I need to reconstruct what the conductor decided without paying for real agents, we believe every decision leaves a durable, replayable trace. We'll know we got it right when the JSONL journal replays the whole run (run-start -> verdicts -> closes -> run-end) and the in-memory loop tests reproduce any scheduling or retry path deterministically.
