# Isolate Seam: Git Worktree Lifecycle

**Goal.** Creates a detached git worktree per plan node at baseRefs[0]. Merges the additional refs sequentially, keeping conflict markers in committed state (B3/C1). Then scans for conflict markers (C1), performs scoped staging (S1), commits to node/id branch (B2), resolves refs (B1), and disposes idempotently.

Worktree isolation lets parallel nodes work on independent copies without interference. It also keeps auditor writes out of verified commits.

## A disposable worktree per node, never a shared branch

`src/seams/isolate.ts:createIsolateSeam` builds the seam, and its `isolate` function calls `git worktree add --detach` into a `mkdtemp` subdirectory under the OS temp dir. Because every worktree lives at its own path, two nodes can fan out from the same base ref in parallel without git's "already checked out" error. The fan-out test (developer:1) exercises this. The worktree starts at `baseRefs[0]`; each remaining ref is merged in sequence. A clean merge (exit 0) moves straight to the next. An unresolvable conflict (exit 1) commits the marker-laden tree in-place with `git add -u && git commit`, rolling nothing back and hiding nothing. It also populates `conflictFiles`, so the [conductor loop](conductor-loop.tend2.html) can surface those paths in the agent's re-prompt. Exit > 1 or an unrelated-histories error triggers `merge --abort`, then `dispose`, then `IsolateCatastrophicError`. The worktree never lands.

`isolate()` detaches a worktree and merges each dependency in turn, with three possible outcomes:

## Markers surface to the agent; the gate decides whether they land

`src/seams/isolate.ts:scanMarkers` runs `git grep -l --untracked -E '^(<{7}|={7}|>{7})'`. Exit 1 from git grep means no matches, so the tree is clean. Exit 0 means matches, and the function returns the file list. Exit > 1 means git itself failed; the function throws `IsolateCatastrophicError` rather than returning an empty array. A gate that cannot run must fail closed. Reporting "clean" here would let conflict markers reach a verified branch (operator:0).

`src/seams/isolate.ts:stage` calls `git add -A -- <files>`, never bare `-A`. The file list comes from the union of `WorkerResult.filesTouched` and `src/seams/isolate.ts:changedFiles` (porcelain, gitignored paths excluded by default). Junk the agent dropped but didn't name cannot enter the commit. `src/seams/isolate.ts:commitBranch` then runs `git commit --allow-empty`, `git branch -f <branch> HEAD`, and `git rev-parse HEAD`. It returns a 40-char SHA, which the loop records as `evidence.diffRef` before calling `emitVerdict` (operator:3). `src/seams/isolate.ts:refSha` resolves any ref to its SHA, returning null if absent. The loop's resume logic uses it to locate a prior verified node's branch without throwing on a first run.

`dispose` calls `git worktree remove --force` and treats "is not a working tree" and "not found" as success (idempotent for double-dispose). Any other non-zero exit throws `IsolateCatastrophicError`, so an unrecognized failure is never silently swallowed. After the worktree is removed, `dispose` deletes the `mkdtemp` parent directory (`tmpBase`) it owns via `fs.rm`. The [conductor loop](conductor-loop.tend2.html) holds `dispose` until after `emitVerdict` returns, so a waking dependent never sees its dependency's worktree vanish mid-resolve. See [the project bet](pleach.tend2.html) for the project bet.

## The git commands, read by exit code

git worktree add --detach in os tmpdir; sequential git merge per baseRef[1..]; conflict exit=1 commits markers in-place; IsolateCatastrophicError on exit>1 or unrelated-histories; git grep -E for marker scan; git add -A -- <files> for scoped stage

## The substrate the loop works against

The git substrate [the conductor loop](conductor-loop.tend2.html) isolates, gates and commits against.

## This seam gives the gate a tree

Every node builds in a disposable worktree off its verified dependencies. The scan that catches a conflict marker before it can reach a verified branch is a gate in [the conductor loop](conductor-loop.tend2.html); this seam is what gives that gate a tree to scan.
