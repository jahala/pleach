# The smoke gate's SARIF and the worktree's friction journal survive settle

**Goal.** At settle, before the worktree is disposed, pleach keeps two things beside the receipt: the smoke gate's stdout when it parses as SARIF 2.1.0 (`<git-dir>/pleach/receipts/<node>.sarif`), and the worktree's friction journal when one exists (`<git-dir>/pleach/receipts/<node>.friction.jsonl`). The sealed envelope additively gains `gates[].artifactSha`, the sha256 of the kept stdout bytes. That is one hash, the same one the umbrella's receipt predicate (`predicate.weeder.sarif.sha256`) will cite.

Ledger D14; jahala/pleach#59. Today the receipt proves the smoke gate ran and how it ended (exit code, sha256 of a 2000-character tail). Nothing else survives the tree. When the smoke is `weeder check --strict`, its stdout is a SARIF log, and that log's `suppressions` are the only record of what an agent waved through in that node. The umbrella's calibration folds need those per-rule counts, and most garden work runs under pleach in worktrees nobody keeps.

## Keeping the gate's stdout, setting scratch aside

The exec seam (src/seams/exec.ts) already drains stdout and stderr separately and interleaves them into `output`. It additionally reports `stdout` alone (additive on `ExecResult`), because a SARIF log is stdout and only stdout. A pure, total `parseSarif` in core recognises a SARIF 2.1.0 log (`version: "2.1.0"`, a `runs` array) and nothing else. In the smoke gate (src/loop/run-node.ts), a stdout that parses is hashed as `artifactSha: sha256(stdout)` on the gate record, sealed at mint like `outputTailSha`. The bytes ride the hand-back to settle (src/loop/run-plan.ts), where the receipt store writes them beside the receipt, the receipt file names them outside the envelope (`artifacts.sarif`), and the journal records one `gate-artifact` {node, gate, path, sha256}. A stdout that is not SARIF keeps nothing and leaves the record byte-identical to today.

Collection first learns what is not delivery. The worker's touched set (umbel's manifest ∪ `changedFiles`) can name a scratch file under `.loop-scratch/` (the very place the work order sends it), an ignored path, or an absolute path outside the worktree. Today `git add` of an ignored path exits 1 and the finished node dies catastrophically, tree and all (jahala/pleach#74, #79, forty minutes of an Opus build lost on the umbrella on 2026-09-09; #76 is the same trap from the other side). A pure predicate in core sets aside `.loop-scratch/`, `.plotplot/friction/` and anything outside the tree. The seam sets aside what git ignores (`git check-ignore`). The journal names the set-aside paths, and the node closes on what remains. This lands FIRST in the loop. Its node runs alone, lands, and the conductor restarts on the landed code before the rest, because a conductor's code does not change mid-run.

The friction journal is a worktree file the profile names (`.plotplot/friction/<yyyy-mm>.jsonl`, docs/plans/friction-ledger.md §5). When present, it is read through the isolate seam and kept as `<node>.friction.jsonl` (months concatenated in name order), with its own `gate-artifact` event. By the rule above, it is never delivery.

A failed artifact write is journaled as `receipt-write-failed` and never blocks the close, exactly as the receipt file's own write does today.

## The finding log outlives the worktree

A gate's finding log outlives the worktree, bound to the sealed facts by one hash. The calibration ledger can count waved-through rules per node without re-running anything. A friction journal written inside a conducted worktree is no longer lost with the tree.
